site_name: AIVA User Guide
site_url: https://docs.aivaportal.com/
site_description: Comprehensive user guide for AIVA - AI-assisted Variant Analysis platform
site_author: MHS Precision Labs
repo_url: https://github.com/MHSPL/aiva-docs
repo_name: MHSPL/aiva-docs
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      separator: '[\s\-\.\,]+'
  - tags
  - glightbox
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

copyright: "&copy; 2026 Mamidi Health. All rights reserved."

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MHSPL
    - icon: fontawesome/solid/globe
      link: https://mamidi.ai
      name: About Us
    - icon: fontawesome/solid/envelope
      link: https://mamidi.ai/#contact
      name: Contact
    - icon: fontawesome/solid/shield-halved
      link: https://mamidi.ai/privacy-policy
      name: Privacy Policy
    - icon: fontawesome/solid/file-contract
      link: https://mamidi.ai/terms-of-service
      name: Terms of Service
  generator: false

extra_css:
  - assets/stylesheets/custom.css

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Platform Overview: getting-started/platform-overview.md
      - Account Setup: getting-started/account-setup.md
      - Navigating the UI: getting-started/navigating-the-ui.md
      - Your First Sample: getting-started/uploading-your-first-sample.md
      - Subscription Tiers: getting-started/subscription-tiers.md
  - User Guide:
      - Quick Start: quick-start.md
      - Samples:
          - samples/index.md
          - VCF Upload: samples/vcf-upload.md
          - Secondary Analysis: samples/secondary-analysis.md
          - Job Monitoring: samples/job-monitoring.md
          - Managing Samples: samples/managing-samples.md
      - AIVA Chat:
          - aiva-chat/index.md
          - AI Tools: aiva-chat/ai-tools.md
          - MCP Integration:
              - aiva-chat/mcp/index.md
              - Adding MCP Servers: aiva-chat/mcp/adding-mcp-servers.md
              - Using AIVA MCP: aiva-chat/mcp/using-aiva-mcp.md
          - Model Selection: aiva-chat/model-selection.md
      - Table View:
          - analysis/index.md
          - Tertiary Analysis: analysis/tertiary-analysis.md
          - Analysis Panel: analysis/analysis-panel.md
          - Categories: analysis/categories.md


          - ACMG Classification: analysis/acmg-classification.md

      - Reports:
          - reports/index.md
      - Playbooks:
          - playbooks/index.md
      - Variant Classifier:
          - classification/index.md
  - API Reference: api/index.md
  - Compliance: compliance/index.md
  - Resources:
      - FAQ: faq.md
      - Glossary: glossary.md
      - Changelog: changelog.md
